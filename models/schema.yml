models:
  - name: stg_nations
    columns:
      - name: nation_id
        data_tests:
          - unique
          - not_null
      - name: region_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_id
              config:
                store failures : true
  - name: stg_regions
    columns:
      - name: region_id
        data_tests:
          - unique
          - not_null
      - name: name
        data_tests:
          - not_null
          - accepted_values:
              values: ['AFRICA', 'AMERICA', 'ASIA', 'EUROPE', 'MIDDLE EAST']